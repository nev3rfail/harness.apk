name: master

on:
  push:
    branches: [master]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      # settings.gradle.kts places :terminal-library inside the ghostty submodule,
      # so Gradle cannot configure without it. One level is enough: the nested
      # libghostty-vt is the renderer's source, and under -PskipNativeBuild the
      # task that reads it is never realized.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: true

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Both build files name an ndkVersion and a CMake revision, and AGP builds
      # a CXX model for every project at configuration time whatever task was
      # asked for, so the pair has to resolve even in a job that compiles no
      # native code.
      - name: Install the NDK and CMake
        run: |
          set -euo pipefail
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "ndk;29.0.14206865" "cmake;3.22.1"

      # The packaged proot follows termux.net's, so a proot-distro built for
      # that version finds the options it passes.
      - name: The packaged proot is termux.net's version
        run: scripts/build-proot.sh --check-termux

      # The host tests that build their own code with the runner's gcc. The proot
      # and musl end-to-end tests need the builds pr.yml runs, so they stay there.
      - name: Router host tests
        run: sh app/src/main/cpp/harness-exec/tests/run.sh

      - name: librelocate and repack-deb host tests
        run: sh app/src/main/cpp/relocate-tests/run.sh

      - name: Syscall shim host tests
        run: sh vendor/ghostty-android/android/terminal-library/src/main/cpp/tests/run.sh

      # Unit tests run on the JVM, so no native code is built.
      - name: Unit tests
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest \
              -PskipNativeBuild=true -PskipLoaderBuild=true -PskipProotBuild=true
