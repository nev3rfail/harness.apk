name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      # A releasable tag names a commit in master's history. --is-ancestor is
      # exact and counts equality as ancestry.
      - name: The tagged commit is on master
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || {
            echo "$GITHUB_SHA is not an ancestor of origin/master" >&2
            exit 1
          }

      # The release body comes from the tag object's message. On a lightweight
      # tag %(contents:...) resolves against the commit instead, which would
      # silently publish the commit message, so the tag object is required here
      # rather than discovered at release time.
      - name: The tag is annotated
        run: |
          set -euo pipefail
          # --force because checkout can leave a lightweight ref shadowing the
          # annotated tag object.
          git fetch --tags --force
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != tag ]; then
            echo "$GITHUB_REF_NAME is not an annotated tag" >&2
            exit 1
          fi

  build:
    needs: guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      # First, so a malformed tag fails before the toolchains and the two Zig
      # cross-compiles.
      - name: Derive the version from the tag
        id: version
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          # The encoding gives minor and patch two digits each, so a wider
          # component would collide: 1.100.0 and 2.0.0 both encode to 20000.
          # Leading zeros are refused so a tag has one spelling.
          printf '%s' "$V" \
              | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$' || {
            echo "tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH with minor and patch under 100" >&2
            exit 1
          }
          IFS=. read -r MAJ MIN PAT <<<"$V"
          echo "name=$V" >> "$GITHUB_OUTPUT"
          # 10# so a zero-padded component is read as decimal, not octal.
          echo "code=$((10#$MAJ * 10000 + 10#$MIN * 100 + 10#$PAT))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # build-android-nonix.sh belongs to the ghostty-android repository, which
      # carries it without an exec bit, and this job runs it as a program.
      - name: Restore the exec bit
        run: chmod +x vendor/ghostty-android/scripts/build-android-nonix.sh

      # patchelf adds the renderer's DT_NEEDED entries; gcc-aarch64-linux-gnu is
      # the cross compiler musl's arm64 build asks for.
      - name: Install the toolchains the scripts shell out to
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends patchelf gcc-aarch64-linux-gnu

      # The NDK revision is app/build.gradle.kts's ndkVersion, and the CMake
      # revision is the one both externalNativeBuild blocks name.
      - name: Install the NDK and CMake
        run: |
          set -euo pipefail
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "ndk;29.0.14206865" "cmake;3.22.1"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install zig
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig-x86_64-linux-0.16.0.tar.xz" \
              | sha256sum -c -
          tar -xf zig-x86_64-linux-0.16.0.tar.xz
          echo "ZIG=$RUNNER_TEMP/zig-x86_64-linux-0.16.0/zig" >> "$GITHUB_ENV"

      # Both jniLibs trees are git-ignored, so a fresh checkout carries neither
      # the renderer nor the loader and nothing can be assembled until they exist.
      - name: Build the renderer
        run: |
          set -euo pipefail
          vendor/ghostty-android/scripts/build-android-nonix.sh arm64-v8a
          vendor/ghostty-android/scripts/build-android-nonix.sh x86_64

      - name: Build the musl loaders
        run: scripts/build-loaders.sh

      # This job runs the whole Gradle graph, two Zig cross-compiles and
      # build-loaders.sh, and holds no secret.
      - name: Assemble the unsigned release
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease :app:testDebugUnitTest \
              -PskipNativeBuild=true -PskipLoaderBuild=true \
              -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-24.04
    # The signing secrets live here behind required reviewers, so a workflow
    # pushed on a branch cannot reach the key without a human approving the run.
    environment: prod
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # apksigner is a Java program and raises its JDK floor between releases,
      # so this job pins one too. No Gradle runs here, hence no cache.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: app-release-unsigned

      # zipalign and apksigner produce the artifact that ships, so the revision
      # they come from is pinned rather than whatever the image happens to hold.
      - name: Install the build tools
        run: |
          set -euo pipefail
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "build-tools;35.0.1"
          echo "BT=$ANDROID_HOME/build-tools/35.0.1" >> "$GITHUB_ENV"

      # $RUNNER_TEMP rather than the workspace, because workspace files end up
      # in artifacts.
      - name: Decode the keystore
        env:
          KS_B64: ${{ secrets.PROD_KEYSTORE_B64 }}
        run: printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/prod.p12"

      # The passwords are named to apksigner as environment variables, so they
      # never appear in argv. The alias does, being a name rather than a secret.
      - name: Align and sign
        env:
          KS_PASS: ${{ secrets.PROD_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.PROD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.PROD_KEY_PASS }}
        run: |
          set -euo pipefail
          "$BT/zipalign" -p -f 4 app-release-unsigned.apk harness.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/prod.p12" --ks-type PKCS12 \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
              harness.apk

      # This is what catches an APK signed with the debug key before it is published.
      - name: The signer is the prod certificate
        run: |
          set -euo pipefail
          # `sed -n 1p` rather than `head -1`: head closing the pipe early would
          # kill apksigner with SIGPIPE and pipefail would report that instead.
          GOT=$("$BT/apksigner" verify --print-certs harness.apk \
              | sed -n 's/.*certificate SHA-256 digest: //p' | sed -n 1p)
          WANT=28f0e4f8272f2354a950c966d8d0a25517fa249ba1a7573f1892c19136825b54
          if [ "$GOT" != "$WANT" ]; then
            echo "signer certificate is '$GOT', not the prod certificate" >&2
            exit 1
          fi
          # The fingerprint above is the first signer's, so the count is checked
          # too: a second signer would otherwise ride along unnoticed.
          SIGNERS=$("$BT/apksigner" verify --verbose harness.apk \
              | sed -n 's/^Number of signers: //p' | sed -n 1p)
          if [ "$SIGNERS" != 1 ]; then
            echo "signed by $SIGNERS signers, expected exactly 1" >&2
            exit 1
          fi

      # The key has done its work, and the release action runs after this.
      - name: Discard the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/prod.p12"

      - name: The release notes are the tag's message
        run: |
          set -euo pipefail
          # --force because checkout can leave a lightweight ref shadowing the
          # annotated tag object. Subject and body separately, so a signed tag
          # does not put a PGP block in the notes.
          git fetch --tags --force
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' \
              "$GITHUB_REF_NAME" > "$RUNNER_TEMP/body.md"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          body_path: ${{ runner.temp }}/body.md
          files: harness.apk
          fail_on_unmatched_files: true
